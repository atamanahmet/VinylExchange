spring:
  jpa:
    hibernate:
      ddl-auto: validate

server:
  error:
    include-message: never
    include-binding-errors: never

payment:
  provider: iyzico
  iyzico:
    api-key: ${IYZICO_API_KEY}
    secret-key: ${IYZICO_SECRET_KEY}
    base-url: ${IYZICO_BASE_URL}
    callback-url: ${IYZICO_CALLBACK_URL}

file:
  upload-listing-dir: /app/uploads/listings/
  upload-cms-dir: /app/uploads/cms/

app:
  frontend-url: ${FRONTEND_URL}

